overrides:
    '@emnapi/runtime': '1.11.3'
    '@hapi/joi': 'npm:joi@18.3.2'
    brace-expansion@<1.1.21: 1.1.22
    brace-expansion@>=4.0.0 <5.0.12: 5.0.13
    esbuild: '0.28.2'
    js-yaml@>=3.0.0 <3.15.2: 3.15.2
    js-yaml@>=4.0.0 <4.3.2: 5.5.0
    morgan@<1.12.1: 1.12.1
    qs@>=2.2.5 <6.16.0: 6.17.1
    sharp: '0.35.5'
    tmp@<0.2.6: 0.2.7
    uuid@<11.1.1: 14.0.3
    # Single Vitest instance: pin every consumer (tests, coverage, Vite+) to the catalog entry.
    vitest@*: 'catalog:'

catalog:
    # The Vite+ toolchain pins. `vitest` and the `@vitest/*` packages must always match the
    # version `vite-plus` bundles (check with `vp toolchain`), otherwise Vitest's internals
    # split between two copies. Renovate updates this family as one group (renovate.json).
    vite-plus: 1.7.0
    vitest: 5.1.0
    '@vitest/coverage-v8': 5.1.0
    '@vitest/ui': 5.1.0

allowBuilds:
    esbuild: true
    sharp: true
    unrs-resolver: true

minimumReleaseAgeExclude:
    - eslint-plugin-astro@3.2.1

auditConfig:
    ignoreGhsas:
        - GHSA-jmr9-qjv8-65gv
        - GHSA-7pqw-9j4j-h8q3
