name: Build and Deploy

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🟢 Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: 🧩 Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: 🏗️ Build Static Site & Optimize
        env:
          NEXT_TELEMETRY_DISABLED: 1
          INTERNAL_ICS_TOKEN: ${{ secrets.INTERNAL_ICS_TOKEN }}
          nextImageExportOptimizer_imageFolderPath: 'public/media/images'
          nextImageExportOptimizer_exportFolderPath: 'out'
          nextImageExportOptimizer_exportFolderName: 'nextImageExportOptimizer'
          nextImageExportOptimizer_quality: '60'
          nextImageExportOptimizer_storePicturesInWEBP: 'true'
          nextImageExportOptimizer_generateAndUseBlurImages: 'true'
          nextImageExportOptimizer_imageSizes: '16,64,128,256,384'
          nextImageExportOptimizer_deviceSizes: '640,1080,1920'
        run: |
          pnpm build
          pnpm next-image-export-optimizer
          node scripts/inline-css.mjs

      - name: 🛠️ Ensure Docker & SSH Tools Installed
        run: |
          if ! command -v ssh >/dev/null 2>&1; then
            echo "Installing openssh-client..."
            if command -v apt-get >/dev/null 2>&1; then
              apt-get update && apt-get install -y openssh-client
            elif command -v apk >/dev/null 2>&1; then
              apk add --no-cache openssh-client
            fi
          fi
          if ! command -v docker >/dev/null 2>&1; then
            echo "Installing Docker CLI..."
            if command -v apt-get >/dev/null 2>&1; then
              curl -fsSL https://get.docker.com | sh
            elif command -v apk >/dev/null 2>&1; then
              apk add --no-cache docker-cli
            fi
          fi

      - name: 🐳 Build Static Nginx Image
        run: |
          TAG="${{ github.ref_name == 'main' && 'latest' || 'dev' }}"
          echo "Building image dpsg-wehr:$TAG ..."
          docker build -t dpsg-wehr:$TAG -f Dockerfile.static .

      - name: 🚀 Stream Image & Deploy to VPS over SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          VPS_PATH: ${{ secrets.VPS_PATH || '/home/linus/docker/website-pfadfinder' }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts

          TAG="${{ github.ref_name == 'main' && 'latest' || 'dev' }}"
          SVC="${{ github.ref_name == 'main' && 'website' || 'website-dev' }}"

          echo "🚀 Streaming dpsg-wehr:$TAG to VPS ($VPS_HOST)..."
          docker save dpsg-wehr:$TAG | ssh -p "$VPS_PORT" -i ~/.ssh/id_ed25519 "$VPS_USER@$VPS_HOST" "docker load"

          echo "🔄 Restarting service $SVC in $VPS_PATH on VPS..."
          ssh -p "$VPS_PORT" -i ~/.ssh/id_ed25519 "$VPS_USER@$VPS_HOST" "cd \"$VPS_PATH\" && docker compose up -d $SVC && docker image prune -f"

          echo "✅ Deployment completed successfully!"
