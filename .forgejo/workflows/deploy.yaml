name: Build, Test & Deploy

on:
    push:
        branches:
            - main
            - dev
        paths-ignore:
            - 'docs/**'
            - 'README.md'
            - 'LICENSE'
            - 'docker-compose.yml'
            - '.forgejo/workflows/ai-pr-triage.yaml'
            - '.forgejo/workflows/renovate.yaml'
    pull_request:
        branches:
            - main
            - dev
        paths-ignore:
            - 'docs/**'
            - 'README.md'
            - 'LICENSE'
            - 'docker-compose.yml'
            - '.forgejo/workflows/ai-pr-triage.yaml'
            - '.forgejo/workflows/renovate.yaml'
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    test:
        name: 🧪 Run Tests & Checks
        runs-on: ubuntu-latest
        container:
            image: mcr.microsoft.com/playwright:v1.63.0-noble
        steps:
            - uses: actions/checkout@v7.0.1

            - name: 📦 Setup pnpm
              uses: pnpm/action-setup@v6.1.0

            - name: 🟢 Setup Node.js 24
              uses: actions/setup-node@v7.1.0
              with:
                  node-version: 24.22.0
                  cache: 'pnpm'

            - name: 🔑 Fetch Secrets from Infisical
              env:
                  INFISICAL_API_URL: ${{ secrets.INFISICAL_API_URL }}
                  INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
                  INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
                  INFISICAL_PROJECT_ID: ${{ secrets.INFISICAL_PROJECT_ID }}
              run: |
                  if [ -z "$INFISICAL_CLIENT_ID" ]; then
                    echo "Notice: INFISICAL_CLIENT_ID not set, skipping Infisical secrets fetch."
                    exit 0
                  fi

                  npm install -g @infisical/cli

                  INFISICAL_TOKEN=$(infisical login \
                    --domain="${INFISICAL_API_URL}" \
                    --method=universal-auth \
                    --client-id="${INFISICAL_CLIENT_ID}" \
                    --client-secret="${INFISICAL_CLIENT_SECRET}" \
                    --silent \
                    --plain)
                  export INFISICAL_TOKEN

                  infisical export \
                    --domain="${INFISICAL_API_URL}" \
                    --projectId="${INFISICAL_PROJECT_ID}" \
                    --env="prod" \
                    --path="/projects/website-dpsg-wehr" \
                    --format=dotenv | sed -E "s/=(['\"])(.*)\1$/=\2/" >> "$GITHUB_ENV"

            - name: 🧩 Install dependencies
              run: pnpm install --frozen-lockfile

            - name: ⚡ Cache Astro Build
              uses: actions/cache@v6.1.0
              with:
                  path: .astro/cache
                  key: ${{ runner.os }}-astro-build-cache-${{ hashFiles('src/assets/images/**', 'content/photos.json', 'pnpm-lock.yaml') }}
                  restore-keys: |
                      ${{ runner.os }}-astro-build-cache-

            - name: 🔍 Typecheck & Lint
              run: |
                  pnpm typecheck
                  pnpm lint

            - name: 🔒 Security Audit
              run: pnpm audit --audit-level=critical || true

            - name: 🏗️ Build website
              env:
                  PUBLIC_GIT_COMMIT: ${{ github.sha }}
                  PUBLIC_GIT_REF: ${{ github.ref_name }}
                  PUBLIC_APP_ENV: test
              run: pnpm build

            - name: 🎭 Ensure Playwright browsers are installed
              run: pnpm exec playwright install chromium

            - name: 🚨 Run tests
              run: pnpm test:all

            - name: ⚡ Audit with Lighthouse CI
              if: github.ref_name == 'main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
              run: pnpm audit:lighthouse

            - name: 📤 Upload Test Reports to Dufs
              if: ${{ !cancelled() }}
              run: |
                  REPORTS_SERVER_URL=$(echo "$REPORTS_SERVER_URL" | sed -e "s/^['\"]//" -e "s/['\"]$//")
                  REPORTS_CI_PASSWORD=$(echo "$REPORTS_CI_PASSWORD" | sed -e "s/^['\"]//" -e "s/['\"]$//")

                  if [ -z "$REPORTS_SERVER_URL" ] || [ -z "$REPORTS_CI_PASSWORD" ]; then
                    echo "Notice: REPORTS_SERVER_URL or REPORTS_CI_PASSWORD not set, skipping Dufs upload."
                    exit 0
                  fi

                  apt-get update -qy && apt-get install -qy rclone

                  OBSCURED_PASS=$(rclone obscure "$REPORTS_CI_PASSWORD")
                  REPO_NAME="${{ github.event.repository.name }}"
                  if [ -z "$REPO_NAME" ]; then
                    REPO_NAME="${GITHUB_REPOSITORY##*/}"
                  fi
                  RUN_NUM="${{ github.run_number }}"
                  if [ -z "$RUN_NUM" ]; then
                    RUN_NUM="${GITHUB_RUN_NUMBER:-latest}"
                  fi
                  TARGET_PATH="${REPO_NAME}/${RUN_NUM}"
                  LATEST_PATH="${REPO_NAME}/latest"

                  mkdir -p ./test-results
                  printf '<!DOCTYPE html><html><head><meta http-equiv="refresh" content="0; url=./e2e/index.html"></head><body><a href="./e2e/index.html">Playwright E2E Report</a></body></html>' > ./test-results/index.html

                  # Upload run-specific reports
                  rclone copy ./test-results :webdav:"$TARGET_PATH" \
                    --webdav-url "$REPORTS_SERVER_URL" \
                    --webdav-user ci \
                    --webdav-pass "$OBSCURED_PASS" \
                    --webdav-vendor other

                  # Update 'latest' pointer
                  rclone copy ./test-results :webdav:"$LATEST_PATH" \
                    --webdav-url "$REPORTS_SERVER_URL" \
                    --webdav-user ci \
                    --webdav-pass "$OBSCURED_PASS" \
                    --webdav-vendor other

            - name: 💬 Post Reports Comment on PR
              if: github.event_name == 'pull_request' && !cancelled()
              env:
                  FORGEJO_API: 'https://git.linus-fischer.de/api/v1'
                  FORGEJO_TOKEN: ${{ secrets.RENOVATE_TOKEN || secrets.GITHUB_TOKEN }}
                  REPO: ${{ github.repository }}
                  PR_NUMBER: ${{ github.event.pull_request.number }}
              run: |
                  python3 - << 'EOF'
                  import os, json, urllib.request

                  api = os.getenv("FORGEJO_API")
                  token = os.getenv("FORGEJO_TOKEN")
                  repo = os.getenv("REPO")
                  pr = os.getenv("PR_NUMBER")
                  reports_url = os.getenv("REPORTS_SERVER_URL", "").rstrip("/")
                  lhci_url = (os.getenv("LHCI_SERVER_BASE_URL") or os.getenv("LHCI_SERVER_URL") or "").rstrip("/")
                  run_num = os.getenv("GITHUB_RUN_NUMBER", "latest")
                  repo_name = repo.split("/")[-1] if "/" in repo else repo

                  if not token or not repo or not pr:
                      print("Notice: Missing token, repo, or PR number. Skipping comment.")
                      exit(0)

                  links = []
                  if reports_url:
                      links.append(f"- 🎭 **Playwright E2E Report**: [Interactive Report & Traces]({reports_url}/{repo_name}/{run_num}/e2e/index.html)")
                  if lhci_url and (os.path.exists(".lighthouseci") or os.path.exists("./test-results/lighthouse")):
                      links.append(f"- ⚡ **Lighthouse Performance**: [LHCI Dashboard & History]({lhci_url}/app/projects/{repo_name})")

                  if not links:
                      print("Notice: Neither reports_url nor lhci_url is set. Skipping comment.")
                      exit(0)

                  audit_label = "Test & Audit Results" if (os.path.exists(".lighthouseci") or os.path.exists("./test-results/lighthouse")) else "Test Results"
                  body = f"### 🧪 {audit_label} (Run #{run_num})\n\n" + "\n".join(links)

                  req = urllib.request.Request(
                      f"{api}/repos/{repo}/issues/{pr}/comments",
                      data=json.dumps({"body": body}).encode("utf-8"),
                      headers={
                          "Authorization": f"token {token}",
                          "Content-Type": "application/json",
                          "User-Agent": "Forgejo-CI-Reports/1.0"
                      }
                  )
                  try:
                      with urllib.request.urlopen(req) as resp:
                          print("Successfully posted PR reports comment.")
                  except Exception as e:
                      print(f"Notice: Could not post PR comment ({e})")
                  EOF

            - name: 📊 Upload Test Reports
              uses: actions/upload-artifact@v3.2.2
              if: ${{ !cancelled() }}
              with:
                  name: test-results
                  path: test-results/
                  retention-days: 14

    automerge:
        name: 🤖 Auto-Merge Verified Bot PR
        needs: test
        if: >-
            github.event_name == 'pull_request' && (
                github.event.pull_request.user.login == 'renovate-bot' ||
                endsWith(github.event.pull_request.user.login, '[bot]') ||
                github.event.pull_request.user.type == 'Bot'
            )
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7.0.1

            - name: Setup Python
              uses: actions/setup-python@v7.0.0
              with:
                  python-version: '3.14.8'

            - name: Check AI Approval & Auto-Merge
              env:
                  FORGEJO_API: 'https://git.linus-fischer.de/api/v1'
                  FORGEJO_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
                  GITHUB_REPOSITORY: ${{ github.repository }}
                  PR_NUMBER: ${{ github.event.pull_request.number }}
                  PR_TITLE: ${{ github.event.pull_request.title }}
              run: |
                  python3 scripts/automerge_pr.py

    build-and-deploy:
        name: 🚀 Build & Deploy
        needs: test
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        runs-on: ubuntu-latest
        steps:
            - name: 📥 Checkout Code
              uses: actions/checkout@v7.0.1
              with:
                  fetch-depth: 0

            - name: 📦 Setup pnpm
              uses: pnpm/action-setup@v6.1.0

            - name: 🟢 Setup Node.js 24
              uses: actions/setup-node@v7.1.0
              with:
                  node-version: 24.22.0
                  cache: 'pnpm'

            - name: 🔑 Fetch Secrets from Infisical
              env:
                  INFISICAL_API_URL: ${{ secrets.INFISICAL_API_URL }}
                  INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
                  INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
                  INFISICAL_PROJECT_ID: ${{ secrets.INFISICAL_PROJECT_ID }}
              run: |
                  if [ -z "$INFISICAL_CLIENT_ID" ]; then
                    echo "Notice: INFISICAL_CLIENT_ID not set, skipping Infisical secrets fetch."
                    exit 0
                  fi

                  npm install -g @infisical/cli

                  INFISICAL_TOKEN=$(infisical login \
                    --domain="${INFISICAL_API_URL}" \
                    --method=universal-auth \
                    --client-id="${INFISICAL_CLIENT_ID}" \
                    --client-secret="${INFISICAL_CLIENT_SECRET}" \
                    --silent \
                    --plain)
                  export INFISICAL_TOKEN

                  infisical export \
                    --domain="${INFISICAL_API_URL}" \
                    --projectId="${INFISICAL_PROJECT_ID}" \
                    --env="prod" \
                    --path="/projects/website-dpsg-wehr" \
                    --format=dotenv | sed -E "s/=(['\"])(.*)\1$/=\2/" >> "$GITHUB_ENV"

            - name: 🧩 Install Dependencies
              run: pnpm install --frozen-lockfile

            - name: ⚡ Cache Astro Build
              uses: actions/cache@v6.1.0
              with:
                  path: .astro/cache
                  key: ${{ runner.os }}-astro-build-cache-${{ hashFiles('src/assets/images/**', 'content/photos.json', 'pnpm-lock.yaml') }}
                  restore-keys: |
                      ${{ runner.os }}-astro-build-cache-

            - name: 🏗️ Build Static Site
              env:
                  INTERNAL_ICS_TOKEN: ${{ secrets.INTERNAL_ICS_TOKEN }}
                  PUBLIC_UMAMI_WEBSITE_ID: ${{ secrets.PUBLIC_UMAMI_WEBSITE_ID || env.PUBLIC_UMAMI_WEBSITE_ID }}
                  PUBLIC_GIT_COMMIT: ${{ github.sha }}
                  PUBLIC_GIT_REF: ${{ github.ref_name }}
                  PUBLIC_APP_ENV: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
              run: pnpm build

            - name: 🛠️ Ensure Docker & SSH Tools Installed
              run: |
                  if ! command -v ssh >/dev/null 2>&1; then
                    echo "Installing openssh-client..."
                    if command -v apt-get >/dev/null 2>&1; then
                      apt-get update && apt-get install -y openssh-client
                    elif command -v apk >/dev/null 2>&1; then
                      apk add --no-cache openssh-client
                    fi
                  fi
                  if ! command -v docker >/dev/null 2>&1; then
                    echo "Installing Docker CLI..."
                    if command -v apt-get >/dev/null 2>&1; then
                      curl -fsSL https://get.docker.com | sh
                    elif command -v apk >/dev/null 2>&1; then
                      apk add --no-cache docker-cli
                    fi
                  fi

            - name: 🐳 Build Static Nginx Image
              run: |
                  TAG="${{ github.ref_name == 'main' && 'latest' || 'dev' }}"
                  echo "Building image dpsg-wehr:$TAG ..."
                  docker build -t dpsg-wehr:$TAG -f Dockerfile.static .

            - name: 🚀 Stream Image & Deploy to VPS over SSH
              env:
                  SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
                  VPS_HOST: ${{ secrets.VPS_HOST }}
                  VPS_USER: ${{ secrets.VPS_USER }}
                  VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
                  VPS_PATH: ${{ secrets.VPS_PATH || '/home/linus/docker/website-pfadfinder' }}
              run: |
                  mkdir -p ~/.ssh
                  echo "$SSH_KEY" > ~/.ssh/id_ed25519
                  chmod 600 ~/.ssh/id_ed25519
                  ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts

                  TAG="${{ github.ref_name == 'main' && 'latest' || 'dev' }}"
                  SVC="${{ github.ref_name == 'main' && 'website' || 'website-dev' }}"

                  echo "🚀 Streaming dpsg-wehr:$TAG to VPS ($VPS_HOST)..."
                  docker save dpsg-wehr:$TAG | ssh -p "$VPS_PORT" -i ~/.ssh/id_ed25519 "$VPS_USER@$VPS_HOST" "docker load"

                  echo "🔄 Restarting service $SVC in $VPS_PATH on VPS..."
                  ssh -p "$VPS_PORT" -i ~/.ssh/id_ed25519 "$VPS_USER@$VPS_HOST" "cd \"$VPS_PATH\" && docker compose up -d $SVC && docker image prune -f"

                  echo "🔍 Verifying deployment via /version.json..."
                  EXPECTED_SHA="${{ github.sha }}"
                  VERIFIED=false
                  for i in {1..12}; do
                    CONTAINER_INFO=$(ssh -p "$VPS_PORT" -i ~/.ssh/id_ed25519 "$VPS_USER@$VPS_HOST" "cd \"$VPS_PATH\" && docker compose exec -T $SVC curl -fsS http://127.0.0.1/version.json" 2>/dev/null || true)
                    DEPLOYED_SHA=$(echo "$CONTAINER_INFO" | python3 -c "import sys, json; print(json.load(sys.stdin).get('commit', ''))" 2>/dev/null || true)
                    if [ "$DEPLOYED_SHA" = "$EXPECTED_SHA" ]; then
                      echo "✅ Container is running expected commit: $DEPLOYED_SHA"
                      VERIFIED=true
                      break
                    fi
                    echo "Waiting for container update (attempt $i/12, current: ${DEPLOYED_SHA:-unknown})..."
                    sleep 3
                  done

                  if [ "$VERIFIED" != "true" ]; then
                    echo "⚠️ Notice: Container running commit does not match $EXPECTED_SHA or could not be verified."
                  fi

                  if [ "$SVC" = "website" ]; then
                    echo "🌐 Checking public endpoint https://dpsg-wehr.de/version.json..."
                    PUBLIC_INFO=$(curl -fsSL https://dpsg-wehr.de/version.json 2>/dev/null || true)
                    PUBLIC_SHA=$(echo "$PUBLIC_INFO" | python3 -c "import sys, json; print(json.load(sys.stdin).get('commit', ''))" 2>/dev/null || true)
                    echo "Public endpoint commit: ${PUBLIC_SHA:-unknown}"
                  fi

                  echo "✅ Deployment completed successfully!"
