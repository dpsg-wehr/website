name: Build, Test & Deploy

on:
    push:
        branches:
            - main
            - dev
        tags:
            - 'v*'
        paths-ignore:
            - 'docs/**'
            - 'README.md'
            - 'LICENSE'
            - 'docker-compose.yml'
            - '.forgejo/workflows/ai-pr-triage.yaml'
            - '.forgejo/workflows/renovate.yaml'
    pull_request:
        branches:
            - main
            - dev
        paths-ignore:
            - 'docs/**'
            - 'README.md'
            - 'LICENSE'
            - 'docker-compose.yml'
            - '.forgejo/workflows/ai-pr-triage.yaml'
            - '.forgejo/workflows/renovate.yaml'
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    test:
        name: 🧪 Run Tests & Checks
        runs-on: ubuntu-latest
        container:
            image: mcr.microsoft.com/playwright:v1.63.0-noble
        steps:
            - uses: actions/checkout@v7.0.1

            - name: 📦 Setup pnpm
              uses: pnpm/action-setup@v6.1.1

            - name: 🟢 Setup Node.js 24
              uses: actions/setup-node@v7.1.0
              with:
                  node-version: 26.13.0
                  cache: 'pnpm'

            - name: 🔑 Fetch Secrets from Infisical
              env:
                  INFISICAL_API_URL: ${{ secrets.INFISICAL_API_URL }}
                  INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
                  INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
                  INFISICAL_PROJECT_ID: ${{ secrets.INFISICAL_PROJECT_ID }}
              run: |
                  if [ -z "$INFISICAL_CLIENT_ID" ]; then
                    echo "Notice: INFISICAL_CLIENT_ID not set, skipping Infisical secrets fetch."
                    exit 0
                  fi

                  npm install -g @infisical/cli

                  INFISICAL_TOKEN=$(infisical login \
                    --domain="${INFISICAL_API_URL}" \
                    --method=universal-auth \
                    --client-id="${INFISICAL_CLIENT_ID}" \
                    --client-secret="${INFISICAL_CLIENT_SECRET}" \
                    --silent \
                    --plain)
                  export INFISICAL_TOKEN

                  infisical export \
                    --domain="${INFISICAL_API_URL}" \
                    --projectId="${INFISICAL_PROJECT_ID}" \
                    --env="prod" \
                    --path="/projects/website-dpsg-wehr" \
                    --format=dotenv | sed -E "s/=(['\"])(.*)\1$/=\2/" >> "$GITHUB_ENV"

            - name: 🧩 Install dependencies
              run: pnpm install --frozen-lockfile

            - name: ⚡ Cache Astro Build
              uses: actions/cache@v6.1.0
              with:
                  path: .astro/cache
                  key: ${{ runner.os }}-astro-build-cache-${{ hashFiles('src/assets/images/**', 'content/photos.json', 'pnpm-lock.yaml') }}
                  restore-keys: |
                      ${{ runner.os }}-astro-build-cache-

            - name: 🔍 Typecheck & Lint
              run: |
                  pnpm typecheck
                  pnpm lint

            - name: 🔒 Security Audit
              run: pnpm audit --audit-level=critical || true

            - name: 🏗️ Build website
              env:
                  PUBLIC_GIT_COMMIT: ${{ github.sha }}
                  PUBLIC_GIT_REF: ${{ github.ref_name }}
                  PUBLIC_APP_ENV: test
              run: pnpm build

            - name: 🎭 Ensure Playwright browsers are installed
              run: pnpm exec playwright install chromium

            - name: 🚨 Run tests
              run: pnpm test:all

            - name: ⚡ Audit with Lighthouse CI
              if: github.ref_name == 'main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
              run: pnpm audit:lighthouse

            - name: 📤 Upload Test Reports to Dufs
              if: ${{ !cancelled() }}
              run: |
                  REPORTS_SERVER_URL=$(echo "$REPORTS_SERVER_URL" | sed -e "s/^['\"]//" -e "s/['\"]$//")
                  REPORTS_CI_PASSWORD=$(echo "$REPORTS_CI_PASSWORD" | sed -e "s/^['\"]//" -e "s/['\"]$//")

                  if [ -z "$REPORTS_SERVER_URL" ] || [ -z "$REPORTS_CI_PASSWORD" ]; then
                    echo "Notice: REPORTS_SERVER_URL or REPORTS_CI_PASSWORD not set, skipping Dufs upload."
                    exit 0
                  fi

                  apt-get update -qy && apt-get install -qy rclone

                  OBSCURED_PASS=$(rclone obscure "$REPORTS_CI_PASSWORD")
                  REPO_NAME="${{ github.event.repository.name }}"
                  if [ -z "$REPO_NAME" ]; then
                    REPO_NAME="${GITHUB_REPOSITORY##*/}"
                  fi
                  RUN_NUM="${{ github.run_number }}"
                  if [ -z "$RUN_NUM" ]; then
                    RUN_NUM="${GITHUB_RUN_NUMBER:-latest}"
                  fi
                  TARGET_PATH="${REPO_NAME}/${RUN_NUM}"
                  LATEST_PATH="${REPO_NAME}/latest"

                  mkdir -p ./test-results
                  printf '<!DOCTYPE html><html><head><meta http-equiv="refresh" content="0; url=./e2e/index.html"></head><body><a href="./e2e/index.html">Playwright E2E Report</a></body></html>' > ./test-results/index.html

                  # Upload run-specific reports
                  rclone copy ./test-results :webdav:"$TARGET_PATH" \
                    --webdav-url "$REPORTS_SERVER_URL" \
                    --webdav-user ci \
                    --webdav-pass "$OBSCURED_PASS" \
                    --webdav-vendor other

                  # Update 'latest' pointer
                  rclone copy ./test-results :webdav:"$LATEST_PATH" \
                    --webdav-url "$REPORTS_SERVER_URL" \
                    --webdav-user ci \
                    --webdav-pass "$OBSCURED_PASS" \
                    --webdav-vendor other

            - name: 💬 Post Reports Comment on PR
              if: github.event_name == 'pull_request' && !cancelled()
              env:
                  FORGEJO_API: 'https://git.linus-fischer.de/api/v1'
                  FORGEJO_TOKEN: ${{ secrets.RENOVATE_TOKEN || secrets.GITHUB_TOKEN }}
                  REPO: ${{ github.repository }}
                  PR_NUMBER: ${{ github.event.pull_request.number }}
              run: |
                  python3 - << 'EOF'
                  import os, json, urllib.request

                  api = os.getenv("FORGEJO_API")
                  token = os.getenv("FORGEJO_TOKEN")
                  repo = os.getenv("REPO")
                  pr = os.getenv("PR_NUMBER")
                  reports_url = os.getenv("REPORTS_SERVER_URL", "").rstrip("/")
                  lhci_url = (os.getenv("LHCI_SERVER_BASE_URL") or os.getenv("LHCI_SERVER_URL") or "").rstrip("/")
                  run_num = os.getenv("GITHUB_RUN_NUMBER", "latest")
                  repo_name = repo.split("/")[-1] if "/" in repo else repo

                  if not token or not repo or not pr:
                      print("Notice: Missing token, repo, or PR number. Skipping comment.")
                      exit(0)

                  links = []
                  if reports_url:
                      links.append(f"- 🎭 **Playwright E2E Report**: [Interactive Report & Traces]({reports_url}/{repo_name}/{run_num}/e2e/index.html)")
                  if lhci_url and (os.path.exists(".lighthouseci") or os.path.exists("./test-results/lighthouse")):
                      links.append(f"- ⚡ **Lighthouse Performance**: [LHCI Dashboard & History]({lhci_url}/app/projects/{repo_name})")

                  if not links:
                      print("Notice: Neither reports_url nor lhci_url is set. Skipping comment.")
                      exit(0)

                  audit_label = "Test & Audit Results" if (os.path.exists(".lighthouseci") or os.path.exists("./test-results/lighthouse")) else "Test Results"
                  body = f"### 🧪 {audit_label} (Run #{run_num})\n\n" + "\n".join(links)

                  req = urllib.request.Request(
                      f"{api}/repos/{repo}/issues/{pr}/comments",
                      data=json.dumps({"body": body}).encode("utf-8"),
                      headers={
                          "Authorization": f"token {token}",
                          "Content-Type": "application/json",
                          "User-Agent": "Forgejo-CI-Reports/1.0"
                      }
                  )
                  try:
                      with urllib.request.urlopen(req) as resp:
                          print("Successfully posted PR reports comment.")
                  except Exception as e:
                      print(f"Notice: Could not post PR comment ({e})")
                  EOF

            - name: 📊 Upload Test Reports
              uses: actions/upload-artifact@v3.2.2
              if: ${{ !cancelled() }}
              with:
                  name: test-results
                  path: test-results/
                  retention-days: 14

    automerge:
        name: 🤖 Auto-Merge Verified Bot PR
        needs: test
        if: >-
            github.event_name == 'pull_request' && (
                github.event.pull_request.user.login == 'renovate-bot' ||
                endsWith(github.event.pull_request.user.login, '[bot]') ||
                github.event.pull_request.user.type == 'Bot'
            )
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7.0.1

            - name: Setup Python
              uses: actions/setup-python@v7.1.0
              with:
                  python-version: '3.15.2'

            - name: Check AI Approval & Auto-Merge
              env:
                  FORGEJO_API: 'https://git.linus-fischer.de/api/v1'
                  FORGEJO_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
                  GITHUB_REPOSITORY: ${{ github.repository }}
                  PR_NUMBER: ${{ github.event.pull_request.number }}
                  PR_TITLE: ${{ github.event.pull_request.title }}
              run: |
                  python3 scripts/automerge_pr.py

    build-and-deploy:
        name: 🐳 Build & Publish Container Image
        needs: test
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        runs-on: ubuntu-latest
        steps:
            - name: 📥 Checkout Code
              uses: actions/checkout@v7.0.1
              with:
                  fetch-depth: 0

            - name: 📦 Setup pnpm
              uses: pnpm/action-setup@v6.1.1

            - name: 🟢 Setup Node.js 24
              uses: actions/setup-node@v7.1.0
              with:
                  node-version: 26.13.0
                  cache: 'pnpm'

            - name: 🔑 Fetch Secrets from Infisical
              env:
                  INFISICAL_API_URL: ${{ secrets.INFISICAL_API_URL }}
                  INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
                  INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
                  INFISICAL_PROJECT_ID: ${{ secrets.INFISICAL_PROJECT_ID }}
              run: |
                  if [ -z "$INFISICAL_CLIENT_ID" ]; then
                    echo "Notice: INFISICAL_CLIENT_ID not set, skipping Infisical secrets fetch."
                    exit 0
                  fi

                  npm install -g @infisical/cli

                  INFISICAL_TOKEN=$(infisical login \
                    --domain="${INFISICAL_API_URL}" \
                    --method=universal-auth \
                    --client-id="${INFISICAL_CLIENT_ID}" \
                    --client-secret="${INFISICAL_CLIENT_SECRET}" \
                    --silent \
                    --plain)
                  export INFISICAL_TOKEN

                  infisical export \
                    --domain="${INFISICAL_API_URL}" \
                    --projectId="${INFISICAL_PROJECT_ID}" \
                    --env="prod" \
                    --path="/projects/website-dpsg-wehr" \
                    --format=dotenv | sed -E "s/=(['\"])(.*)\1$/=\2/" >> "$GITHUB_ENV"

            - name: 🧩 Install Dependencies
              run: pnpm install --frozen-lockfile

            - name: ⚡ Cache Astro Build
              uses: actions/cache@v6.1.0
              with:
                  path: .astro/cache
                  key: ${{ runner.os }}-astro-build-cache-${{ hashFiles('src/assets/images/**', 'content/photos.json', 'pnpm-lock.yaml') }}
                  restore-keys: |
                      ${{ runner.os }}-astro-build-cache-

            - name: 🏗️ Build Static Site
              env:
                  INTERNAL_ICS_TOKEN: ${{ secrets.INTERNAL_ICS_TOKEN }}
                  PUBLIC_UMAMI_WEBSITE_ID: ${{ secrets.PUBLIC_UMAMI_WEBSITE_ID || env.PUBLIC_UMAMI_WEBSITE_ID }}
                  PUBLIC_GIT_COMMIT: ${{ github.sha }}
                  PUBLIC_GIT_REF: ${{ github.ref_name }}
                  PUBLIC_APP_ENV: ${{ (github.ref_name == 'main' || startsWith(github.ref, 'refs/tags/')) && 'production' || 'staging' }}
              run: pnpm build

            - name: 🛠️ Ensure Docker CLI Installed
              run: |
                  if ! command -v docker >/dev/null 2>&1; then
                    echo "Installing Docker CLI..."
                    if command -v apt-get >/dev/null 2>&1; then
                      curl -fsSL https://get.docker.com | sh
                    elif command -v apk >/dev/null 2>&1; then
                      apk add --no-cache docker-cli
                    fi
                  fi

            - name: 🔑 Log in to Forgejo Container Registry
              run: |
                  echo "${{ secrets.REGISTRY_TOKEN || secrets.FORGEJO_TOKEN || secrets.GITHUB_TOKEN }}" | docker login git.linus-fischer.de -u "${{ github.actor }}" --password-stdin

            - name: 🏷️ Determine Image Tags & OCI Labels
              id: meta
              run: |
                  IMAGE_BASE="git.linus-fischer.de/${{ github.repository }}"
                  IMAGE_BASE=$(echo "$IMAGE_BASE" | tr '[:upper:]' '[:lower:]')

                  PKG_VERSION=$(node -p "require('./package.json').version")
                  CLEAN_VERSION="${PKG_VERSION#v}"
                  SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
                  BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
                  SOURCE_URL="https://git.linus-fischer.de/${{ github.repository }}"
                  SOURCE_URL=$(echo "$SOURCE_URL" | tr '[:upper:]' '[:lower:]')

                  # Base tags: exact commit SHA and short SHA
                  TAGS="-t ${IMAGE_BASE}:${{ github.sha }} -t ${IMAGE_BASE}:sha-${SHORT_SHA}"
                  BUILD_VERSION="${CLEAN_VERSION}"

                  if [ "${{ github.ref_name }}" = "main" ]; then
                    BUILD_VERSION="${CLEAN_VERSION}"
                    TAGS="${TAGS} -t ${IMAGE_BASE}:${CLEAN_VERSION} -t ${IMAGE_BASE}:v${CLEAN_VERSION} -t ${IMAGE_BASE}:latest"
                    if [[ "$CLEAN_VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
                      MAJOR="${BASH_REMATCH[1]}"
                      MINOR="${BASH_REMATCH[2]}"
                      TAGS="${TAGS} -t ${IMAGE_BASE}:${MAJOR} -t ${IMAGE_BASE}:v${MAJOR} -t ${IMAGE_BASE}:${MAJOR}.${MINOR} -t ${IMAGE_BASE}:v${MAJOR}.${MINOR}"
                    fi
                  elif [ "${{ github.ref_name }}" = "dev" ]; then
                    DEV_VERSION="${CLEAN_VERSION}-dev.${{ github.run_number }}"
                    BUILD_VERSION="${DEV_VERSION}"
                    TAGS="${TAGS} -t ${IMAGE_BASE}:${DEV_VERSION} -t ${IMAGE_BASE}:v${DEV_VERSION} -t ${IMAGE_BASE}:dev -t ${IMAGE_BASE}:dev-${SHORT_SHA}"
                  elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
                    TAG_NAME="${{ github.ref_name }}"
                    CLEAN_TAG="${TAG_NAME#v}"
                    BUILD_VERSION="${CLEAN_TAG}"
                    TAGS="${TAGS} -t ${IMAGE_BASE}:${TAG_NAME} -t ${IMAGE_BASE}:${CLEAN_TAG} -t ${IMAGE_BASE}:latest"
                    if [[ "$CLEAN_TAG" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
                      MAJOR="${BASH_REMATCH[1]}"
                      MINOR="${BASH_REMATCH[2]}"
                      TAGS="${TAGS} -t ${IMAGE_BASE}:${MAJOR} -t ${IMAGE_BASE}:v${MAJOR} -t ${IMAGE_BASE}:${MAJOR}.${MINOR} -t ${IMAGE_BASE}:v${MAJOR}.${MINOR}"
                    fi
                  else
                    SAFE_REF=$(echo "${{ github.ref_name }}" | tr '/' '-')
                    BRANCH_VERSION="${CLEAN_VERSION}-${SAFE_REF}.${{ github.run_number }}"
                    BUILD_VERSION="${BRANCH_VERSION}"
                    TAGS="${TAGS} -t ${IMAGE_BASE}:${SAFE_REF} -t ${IMAGE_BASE}:${BRANCH_VERSION}"
                  fi

                  LABELS="--label org.opencontainers.image.title=website-dpsg-wehr"
                  LABELS="${LABELS} --label org.opencontainers.image.description=Website of DPSG Stamm Franz von Sales Wehr"
                  LABELS="${LABELS} --label org.opencontainers.image.url=https://dpsg-wehr.de"
                  LABELS="${LABELS} --label org.opencontainers.image.source=${SOURCE_URL}"
                  LABELS="${LABELS} --label org.opencontainers.image.version=${BUILD_VERSION}"
                  LABELS="${LABELS} --label org.opencontainers.image.revision=${{ github.sha }}"
                  LABELS="${LABELS} --label org.opencontainers.image.created=${BUILD_DATE}"
                  LABELS="${LABELS} --label org.opencontainers.image.licenses=MIT"
                  LABELS="${LABELS} --label org.opencontainers.image.vendor=DPSG Stamm Franz von Sales Wehr"

                  echo "IMAGE_BASE=${IMAGE_BASE}" >> "$GITHUB_ENV"
                  echo "TAGS=${TAGS}" >> "$GITHUB_ENV"
                  echo "LABELS=${LABELS}" >> "$GITHUB_ENV"
                  echo "BUILD_VERSION=${BUILD_VERSION}" >> "$GITHUB_ENV"
                  echo "BUILD_DATE=${BUILD_DATE}" >> "$GITHUB_ENV"

            - name: 🐳 Build Docker Image
              run: |
                  docker build ${TAGS} ${LABELS} \
                    --build-arg VERSION="${BUILD_VERSION}" \
                    --build-arg VCS_REF="${{ github.sha }}" \
                    --build-arg BUILD_DATE="${BUILD_DATE}" \
                    -f Dockerfile.static .

            - name: 🚀 Push Image to Forgejo Registry
              run: |
                  docker push --all-tags "${IMAGE_BASE}"
