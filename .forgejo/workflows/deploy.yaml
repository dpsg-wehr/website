name: Build, Test & Deploy

on:
    push:
        branches:
            - main
            - dev
        paths-ignore:
            - 'docs/**'
            - 'README.md'
            - 'LICENSE'
            - 'docker-compose.yml'
            - '.forgejo/workflows/ai-pr-triage.yaml'
            - '.forgejo/workflows/renovate.yaml'
    pull_request:
        branches:
            - main
            - dev
        paths-ignore:
            - 'docs/**'
            - 'README.md'
            - 'LICENSE'
            - 'docker-compose.yml'
            - '.forgejo/workflows/ai-pr-triage.yaml'
            - '.forgejo/workflows/renovate.yaml'
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    test:
        name: 🧪 Run Tests & Checks
        runs-on: ubuntu-latest
        container:
            image: mcr.microsoft.com/playwright:v1.62.1-noble
        steps:
            - uses: actions/checkout@v7

            - name: 📦 Setup pnpm
              uses: pnpm/action-setup@v6

            - name: 🟢 Setup Node.js 22
              uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: 'pnpm'

            - name: 🧩 Install dependencies
              run: pnpm install --frozen-lockfile

            - name: ⚡ Cache Next.js Build
              uses: actions/cache@v6
              with:
                  path: .next/cache
                  key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
                  restore-keys: |
                      ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-

            - name: 🔍 Typecheck & Lint
              run: |
                  pnpm typecheck
                  pnpm lint

            - name: 🔒 Security Audit
              run: pnpm audit --audit-level=critical || true

            - name: 🏗️ Build website
              run: pnpm build

            - name: 🚦 Run tests
              run: pnpm test:all

            - name: 📝 Generate Test Summary
              if: ${{ !cancelled() }}
              run: |
                  if [ -n "$GITHUB_STEP_SUMMARY" ]; then
                    echo "### 🧪 Test Suite Results" >> "$GITHUB_STEP_SUMMARY"
                    echo "" >> "$GITHUB_STEP_SUMMARY"
                    if [ -f "test-results/e2e/index.json" ]; then
                      node -e '
                        const fs = require("fs");
                        try {
                          const data = JSON.parse(fs.readFileSync("test-results/e2e/index.json", "utf8"));
                          const rows = data.rows || [];
                          let passed = 0, failed = 0, flakies = 0, skipped = 0;
                          const countCases = (item) => {
                            if (item.type === "case") {
                              if (item.status === "passed") passed++;
                              else if (item.status === "failed") failed++;
                              else if (item.status === "skipped") skipped++;
                              if (item.retry > 0) flakies++;
                            }
                            if (item.subs) item.subs.forEach(countCases);
                          };
                          rows.forEach(countCases);
                          const total = passed + failed + skipped;
                          const duration = data.durationH || (data.duration ? (data.duration/1000).toFixed(1) + "s" : "-");

                          let md = "#### 🎭 Playwright E2E Tests\n\n";
                          md += "| Total | Passed | Failed | Flaky | Skipped | Duration |\n";
                          md += "| :---: | :----: | :----: | :---: | :-----: | :------: |\n";
                          md += `| **${total}** | ✅ ${passed} | ${failed > 0 ? "❌ " + failed : "0"} | ${flakies > 0 ? "⚠️ " + flakies : "0"} | ${skipped} | ⏱️ ${duration} |\n\n`;

                          if (failed > 0) {
                            md += "<details><summary>❌ Failed Tests</summary>\n\n";
                            const findFailed = (item) => {
                              if (item.type === "case" && item.status === "failed") {
                                md += `- **${item.title}** (\`${item.location || ""}\`)\n`;
                              }
                              if (item.subs) item.subs.forEach(findFailed);
                            };
                            rows.forEach(findFailed);
                            md += "\n</details>\n\n";
                          }

                          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, md);
                        } catch (e) {
                          console.error(e);
                        }
                      '
                    fi
                    echo "📁 Download the full HTML reports (Vitest & Playwright) from the **Artifacts** section of this run." >> "$GITHUB_STEP_SUMMARY"
                  fi

            - name: 📊 Upload Test Reports
              uses: actions/upload-artifact@v3
              if: ${{ !cancelled() }}
              with:
                  name: test-results
                  path: test-results/
                  retention-days: 14

    build-and-deploy:
        name: 🚀 Build & Deploy
        needs: test
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        runs-on: ubuntu-latest
        steps:
            - name: 📥 Checkout Code
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: 📦 Setup pnpm
              uses: pnpm/action-setup@v6

            - name: 🟢 Setup Node.js 22
              uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: 'pnpm'

            - name: 🧩 Install Dependencies
              run: pnpm install --frozen-lockfile

            - name: ⚡ Cache Next.js & Image Optimizer
              uses: actions/cache@v6
              with:
                  path: |
                      .next/cache
                      public/**/nextImageExportOptimizer
                      public/media/images/next-image-export-optimizer-hashes.json
                  key: ${{ runner.os }}-build-cache-${{ hashFiles('public/media/images/**', '!public/**/nextImageExportOptimizer/**', '!public/media/images/next-image-export-optimizer-hashes.json') }}-${{ hashFiles('pnpm-lock.yaml') }}
                  restore-keys: |
                      ${{ runner.os }}-build-cache-${{ hashFiles('public/media/images/**', '!public/**/nextImageExportOptimizer/**', '!public/media/images/next-image-export-optimizer-hashes.json') }}-
                      ${{ runner.os }}-build-cache-

            - name: 🏗️ Build Static Site & Optimize
              env:
                  NEXT_TELEMETRY_DISABLED: 1
                  INTERNAL_ICS_TOKEN: ${{ secrets.INTERNAL_ICS_TOKEN }}
                  nextImageExportOptimizer_imageFolderPath: 'public/media/images'
                  nextImageExportOptimizer_exportFolderPath: 'out'
                  nextImageExportOptimizer_exportFolderName: 'nextImageExportOptimizer'
                  nextImageExportOptimizer_quality: '60'
                  nextImageExportOptimizer_storePicturesInWEBP: 'true'
                  nextImageExportOptimizer_generateAndUseBlurImages: 'true'
                  nextImageExportOptimizer_imageSizes: '16,64,128,256,384'
                  nextImageExportOptimizer_deviceSizes: '640,1080,1920'
              run: |
                  pnpm build
                  pnpm next-image-export-optimizer
                  node scripts/inline-css.mjs

            - name: 🛠️ Ensure Docker & SSH Tools Installed
              run: |
                  if ! command -v ssh >/dev/null 2>&1; then
                    echo "Installing openssh-client..."
                    if command -v apt-get >/dev/null 2>&1; then
                      apt-get update && apt-get install -y openssh-client
                    elif command -v apk >/dev/null 2>&1; then
                      apk add --no-cache openssh-client
                    fi
                  fi
                  if ! command -v docker >/dev/null 2>&1; then
                    echo "Installing Docker CLI..."
                    if command -v apt-get >/dev/null 2>&1; then
                      curl -fsSL https://get.docker.com | sh
                    elif command -v apk >/dev/null 2>&1; then
                      apk add --no-cache docker-cli
                    fi
                  fi

            - name: 🐳 Build Static Nginx Image
              run: |
                  TAG="${{ github.ref_name == 'main' && 'latest' || 'dev' }}"
                  echo "Building image dpsg-wehr:$TAG ..."
                  docker build -t dpsg-wehr:$TAG -f Dockerfile.static .

            - name: 🚀 Stream Image & Deploy to VPS over SSH
              env:
                  SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
                  VPS_HOST: ${{ secrets.VPS_HOST }}
                  VPS_USER: ${{ secrets.VPS_USER }}
                  VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
                  VPS_PATH: ${{ secrets.VPS_PATH || '/home/linus/docker/website-pfadfinder' }}
              run: |
                  mkdir -p ~/.ssh
                  echo "$SSH_KEY" > ~/.ssh/id_ed25519
                  chmod 600 ~/.ssh/id_ed25519
                  ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts

                  TAG="${{ github.ref_name == 'main' && 'latest' || 'dev' }}"
                  SVC="${{ github.ref_name == 'main' && 'website' || 'website-dev' }}"

                  echo "🚀 Streaming dpsg-wehr:$TAG to VPS ($VPS_HOST)..."
                  docker save dpsg-wehr:$TAG | ssh -p "$VPS_PORT" -i ~/.ssh/id_ed25519 "$VPS_USER@$VPS_HOST" "docker load"

                  echo "🔄 Restarting service $SVC in $VPS_PATH on VPS..."
                  ssh -p "$VPS_PORT" -i ~/.ssh/id_ed25519 "$VPS_USER@$VPS_HOST" "cd \"$VPS_PATH\" && docker compose up -d $SVC && docker image prune -f"

                  echo "✅ Deployment completed successfully!"
