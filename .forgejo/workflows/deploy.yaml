name: Build, Test & Deploy

on:
    push:
        branches:
            - main
            - dev
        paths-ignore:
            - 'docs/**'
            - 'README.md'
            - 'LICENSE'
            - 'docker-compose.yml'
            - '.forgejo/workflows/ai-pr-triage.yaml'
            - '.forgejo/workflows/renovate.yaml'
    pull_request:
        branches:
            - main
            - dev
        paths-ignore:
            - 'docs/**'
            - 'README.md'
            - 'LICENSE'
            - 'docker-compose.yml'
            - '.forgejo/workflows/ai-pr-triage.yaml'
            - '.forgejo/workflows/renovate.yaml'
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    test:
        name: 🧪 Run Tests & Checks
        runs-on: ubuntu-latest
        container:
            image: mcr.microsoft.com/playwright:v1.62.1-noble
        steps:
            - uses: actions/checkout@v7.0.1

            - name: 📦 Setup pnpm
              uses: pnpm/action-setup@v6.1.0

            - name: 🟢 Setup Node.js 24
              uses: actions/setup-node@v7.0.0
              with:
                  node-version: 24.21.0
                  cache: 'pnpm'

            - name: 🧩 Install dependencies
              run: pnpm install --frozen-lockfile

            - name: ⚡ Cache Astro Build
              uses: actions/cache@v6.1.0
              with:
                  path: .astro/cache
                  key: ${{ runner.os }}-astro-build-cache-${{ hashFiles('src/assets/images/**', 'content/photos.json', 'pnpm-lock.yaml') }}
                  restore-keys: |
                      ${{ runner.os }}-astro-build-cache-

            - name: 🔍 Typecheck & Lint
              run: |
                  pnpm typecheck
                  pnpm lint

            - name: 🔒 Security Audit
              run: pnpm audit --audit-level=critical || true

            - name: 🏗️ Build website
              run: pnpm build

            - name: 🎭 Ensure Playwright browsers are installed
              run: pnpm exec playwright install chromium

            - name: 🚦 Run tests
              run: pnpm test:all

            - name: ⚡ Audit with Lighthouse CI
              run: pnpm audit:lighthouse

            - name: 📝 Generate Test Summary
              if: ${{ !cancelled() }}
              run: |
                  # Ensure dashboard is generated if test results exist
                  npx tsx scripts/generate-test-dashboard.ts || true
                  if [ -n "$GITHUB_STEP_SUMMARY" ]; then
                    echo "### 🧪 Test Suite Results" >> "$GITHUB_STEP_SUMMARY"
                    echo "" >> "$GITHUB_STEP_SUMMARY"
                    if [ -f "test-results/e2e/index.json" ]; then
                      node -e '
                        const fs = require("fs");
                        try {
                          const data = JSON.parse(fs.readFileSync("test-results/e2e/index.json", "utf8"));
                          const rows = data.rows || [];
                          let passed = 0, failed = 0, flakies = 0, skipped = 0;
                          const countCases = (item) => {
                            if (item.type === "case") {
                              if (item.status === "passed") passed++;
                              else if (item.status === "failed") failed++;
                              else if (item.status === "skipped") skipped++;
                              if (item.retry > 0) flakies++;
                            }
                            if (item.subs) item.subs.forEach(countCases);
                          };
                          rows.forEach(countCases);
                          const total = passed + failed + skipped;
                          const duration = data.durationH || (data.duration ? (data.duration/1000).toFixed(1) + "s" : "-");

                          let md = "#### 🎭 Playwright E2E Tests\n\n";
                          md += "| Total | Passed | Failed | Flaky | Skipped | Duration |\n";
                          md += "| :---: | :----: | :----: | :---: | :-----: | :------: |\n";
                          md += `| **${total}** | ✅ ${passed} | ${failed > 0 ? "❌ " + failed : "0"} | ${flakies > 0 ? "⚠️ " + flakies : "0"} | ${skipped} | ⏱️ ${duration} |\n\n`;

                          if (failed > 0) {
                            md += "<details><summary>❌ Failed Tests</summary>\n\n";
                            const findFailed = (item) => {
                              if (item.type === "case" && item.status === "failed") {
                                md += `- **${item.title}** (\`${item.location || ""}\`)\n`;
                              }
                              if (item.subs) item.subs.forEach(findFailed);
                            };
                            rows.forEach(findFailed);
                            md += "\n</details>\n\n";
                          }

                          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, md);
                        } catch (e) {
                          console.error(e);
                        }
                      '
                    fi
                    if [ -f "test-results/lighthouse/manifest.json" ]; then
                      node -e '
                        const fs = require("fs");
                        try {
                          const runs = JSON.parse(fs.readFileSync("test-results/lighthouse/manifest.json", "utf8"));
                          const repRuns = runs.filter((r) => r.isRepresentativeRun);
                          if (repRuns.length > 0) {
                            let md = "#### ⚡ Lighthouse Audit\n\n";
                            md += "| Page | Performance | Accessibility | Best Practices | SEO |\n";
                            md += "| :--- | :---------: | :-----------: | :------------: | :-: |\n";
                            const formatScore = (val) => {
                              const s = Math.round((val || 0) * 100);
                              const icon = s >= 90 ? "🟢" : s >= 80 ? "🟡" : "🔴";
                              return `${icon} ${s}`;
                            };
                            repRuns.forEach((r) => {
                              const u = new URL(r.url);
                              const path = u.pathname.replace("/index.html", "/") || "/";
                              const perf = formatScore(r.summary.performance);
                              const a11y = formatScore(r.summary.accessibility);
                              const bp = formatScore(r.summary["best-practices"]);
                              const seo = formatScore(r.summary.seo);
                              md += `| \`${path}\` | ${perf} | ${a11y} | ${bp} | ${seo} |\n`;
                            });
                            md += "\n";
                            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, md);
                          }
                        } catch (e) {
                          console.error(e);
                        }
                      '
                    fi
                    echo "📁 Download the **test-results** artifact: open \`index.html\` in the root of the unzipped folder for the unified interactive dashboard (Playwright, Vitest & Lighthouse)!" >> "$GITHUB_STEP_SUMMARY"
                  fi

            - name: 📊 Upload Test Reports
              uses: actions/upload-artifact@v3.2.2
              if: ${{ !cancelled() }}
              with:
                  name: test-results
                  path: test-results/
                  retention-days: 14

    automerge:
        name: 🤖 Auto-Merge Verified Bot PR
        needs: test
        if: >-
            github.event_name == 'pull_request' && (
                github.event.pull_request.user.login == 'renovate-bot' ||
                endsWith(github.event.pull_request.user.login, '[bot]') ||
                github.event.pull_request.user.type == 'Bot'
            )
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7.0.1

            - name: Setup Python
              uses: actions/setup-python@v7.0.0
              with:
                  python-version: '3.14.7'

            - name: Check AI Approval & Auto-Merge
              env:
                  FORGEJO_API: 'https://git.linus-fischer.de/api/v1'
                  FORGEJO_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
                  GITHUB_REPOSITORY: ${{ github.repository }}
                  PR_NUMBER: ${{ github.event.pull_request.number }}
                  PR_TITLE: ${{ github.event.pull_request.title }}
              run: |
                  python3 scripts/automerge_pr.py

    build-and-deploy:
        name: 🚀 Build & Deploy
        needs: test
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        runs-on: ubuntu-latest
        steps:
            - name: 📥 Checkout Code
              uses: actions/checkout@v7.0.1
              with:
                  fetch-depth: 0

            - name: 📦 Setup pnpm
              uses: pnpm/action-setup@v6.1.0

            - name: 🟢 Setup Node.js 24
              uses: actions/setup-node@v7.0.0
              with:
                  node-version: 24.21.0
                  cache: 'pnpm'

            - name: 🧩 Install Dependencies
              run: pnpm install --frozen-lockfile

            - name: ⚡ Cache Astro Build
              uses: actions/cache@v6.1.0
              with:
                  path: .astro/cache
                  key: ${{ runner.os }}-astro-build-cache-${{ hashFiles('src/assets/images/**', 'content/photos.json', 'pnpm-lock.yaml') }}
                  restore-keys: |
                      ${{ runner.os }}-astro-build-cache-

            - name: 🏗️ Build Static Site
              env:
                  INTERNAL_ICS_TOKEN: ${{ secrets.INTERNAL_ICS_TOKEN }}
              run: pnpm build

            - name: 🛠️ Ensure Docker & SSH Tools Installed
              run: |
                  if ! command -v ssh >/dev/null 2>&1; then
                    echo "Installing openssh-client..."
                    if command -v apt-get >/dev/null 2>&1; then
                      apt-get update && apt-get install -y openssh-client
                    elif command -v apk >/dev/null 2>&1; then
                      apk add --no-cache openssh-client
                    fi
                  fi
                  if ! command -v docker >/dev/null 2>&1; then
                    echo "Installing Docker CLI..."
                    if command -v apt-get >/dev/null 2>&1; then
                      curl -fsSL https://get.docker.com | sh
                    elif command -v apk >/dev/null 2>&1; then
                      apk add --no-cache docker-cli
                    fi
                  fi

            - name: 🐳 Build Static Nginx Image
              run: |
                  TAG="${{ github.ref_name == 'main' && 'latest' || 'dev' }}"
                  echo "Building image dpsg-wehr:$TAG ..."
                  docker build -t dpsg-wehr:$TAG -f Dockerfile.static .

            - name: 🚀 Stream Image & Deploy to VPS over SSH
              env:
                  SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
                  VPS_HOST: ${{ secrets.VPS_HOST }}
                  VPS_USER: ${{ secrets.VPS_USER }}
                  VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
                  VPS_PATH: ${{ secrets.VPS_PATH || '/home/linus/docker/website-pfadfinder' }}
              run: |
                  mkdir -p ~/.ssh
                  echo "$SSH_KEY" > ~/.ssh/id_ed25519
                  chmod 600 ~/.ssh/id_ed25519
                  ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts

                  TAG="${{ github.ref_name == 'main' && 'latest' || 'dev' }}"
                  SVC="${{ github.ref_name == 'main' && 'website' || 'website-dev' }}"

                  echo "🚀 Streaming dpsg-wehr:$TAG to VPS ($VPS_HOST)..."
                  docker save dpsg-wehr:$TAG | ssh -p "$VPS_PORT" -i ~/.ssh/id_ed25519 "$VPS_USER@$VPS_HOST" "docker load"

                  echo "🔄 Restarting service $SVC in $VPS_PATH on VPS..."
                  ssh -p "$VPS_PORT" -i ~/.ssh/id_ed25519 "$VPS_USER@$VPS_HOST" "cd \"$VPS_PATH\" && docker compose up -d $SVC && docker image prune -f"

                  echo "✅ Deployment completed successfully!"
