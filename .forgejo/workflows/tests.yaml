name: Tests & Checks

on:
    push:
        branches:
            - dev
    pull_request:
        branches:
            - main
            - dev

jobs:
    test:
        name: 🧪 Run Tests
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: 📦 Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 10

            - name: 🟢 Setup Node.js 22
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: 'pnpm'

            - name: 🧩 Install dependencies
              run: pnpm install --frozen-lockfile

            - name: ⚡ Cache Next.js & Image Optimizer
              uses: actions/cache@v4
              with:
                  path: |
                      .next/cache
                      public/media/images/nextImageExportOptimizer
                      public/media/images/next-image-export-optimizer-hashes.json
                  key: ${{ runner.os }}-build-cache-${{ hashFiles('public/media/images/**') }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
                  restore-keys: |
                      ${{ runner.os }}-build-cache-${{ hashFiles('public/media/images/**') }}-
                      ${{ runner.os }}-build-cache-

            - name: ⚙️ Get Playwright Version
              id: playwright-version
              run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

            - name: ⚡ Cache Playwright Browsers
              id: playwright-cache
              uses: actions/cache@v4
              with:
                  path: ~/.cache/ms-playwright
                  key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

            - name: ⚙️ Install Playwright Browsers
              if: steps.playwright-cache.outputs.cache-hit != 'true'
              run: pnpm exec playwright install --with-deps chromium

            - name: ⚙️ Install Playwright OS Dependencies
              if: steps.playwright-cache.outputs.cache-hit == 'true'
              run: pnpm exec playwright install-deps chromium

            - name: 🔍 Typecheck & Lint
              run: |
                  pnpm typecheck
                  pnpm lint

            - name: 🔒 Security Audit
              run: pnpm audit --audit-level=critical || true

            - name: 🏗️ Build website
              env:
                  nextImageExportOptimizer_imageSizes: '16,64,128,256,384'
                  nextImageExportOptimizer_deviceSizes: '640,1080,1920'
              run: |
                  pnpm build
                  pnpm next-image-export-optimizer
                  node scripts/inline-css.mjs

            - name: 🚦 Run tests
              run: pnpm test:all
